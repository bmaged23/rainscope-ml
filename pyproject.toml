[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rainscope-ml"
version = "0.1.0"
description = "Chronological Australian rainfall classification and modern tabular model evaluation"
requires-python = ">=3.13"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.7", "matplotlib>=3.9", "psutil>=6", "joblib>=1.4", "streamlit>=1.40", "fastapi==0.160.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
modern = ["tabm", "tabicl", "torch>=2.5,<2.9"]
dev = ["pytest", "ruff", "httpx", "fastapi", "uvicorn"]
api = ["fastapi==0.160.0", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
