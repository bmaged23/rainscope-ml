services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RAINSCOPE_MODEL: /app/artifacts/serving_model.joblib
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
